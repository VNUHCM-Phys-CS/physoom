<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="physoomBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Rounded purple tile -->
  <rect width="512" height="512" rx="116" fill="url(#physoomBg)"/>

  <!-- Calendar -->
  <g>
    <!-- binding rings -->
    <rect x="176" y="104" width="26" height="56" rx="13" fill="#ede9fe"/>
    <rect x="310" y="104" width="26" height="56" rx="13" fill="#ede9fe"/>
    <!-- body -->
    <rect x="120" y="132" width="272" height="256" rx="34" fill="#ffffff"/>
    <!-- header band -->
    <path d="M120 166 a34 34 0 0 1 34 -34 h204 a34 34 0 0 1 34 34 v34 h-272 z" fill="#c4b5fd"/>
    <!-- grid dots -->
    <g fill="#ddd6fe">
      <rect x="150" y="228" width="46" height="40" rx="10"/>
      <rect x="233" y="228" width="46" height="40" rx="10"/>
      <rect x="316" y="228" width="46" height="40" rx="10"/>
      <rect x="150" y="300" width="46" height="40" rx="10"/>
      <rect x="316" y="300" width="46" height="40" rx="10"/>
    </g>
    <!-- "today" cell accented -->
    <rect x="233" y="300" width="46" height="40" rx="10" fill="#7c3aed"/>
  </g>

  <!-- Atom orbit (physics) overlapping the lower-right -->
  <g stroke="#ffffff" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.95">
    <ellipse cx="368" cy="360" rx="104" ry="42" transform="rotate(-32 368 360)"/>
  </g>
  <circle cx="452" cy="322" r="20" fill="#ffffff"/>
</svg>
